<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison Tia – L’essence du bijou contemporain | Haute-Joaillerie &amp; Beldi</title>
    <meta name="description" content="Maison Tia incarne une vision moderne du luxe : créations précieuses en Or, Diamants de laboratoire éthiques et Argent Beldi traditionnel fait main au Maroc." />

    <!-- Intellectual Property & Copyright Protection Meta -->
    <meta name="copyright" content="© 2026 Maison Tia. Tous droits réservés. Marque et modèles déposés." />
    <meta name="author" content="Maison Tia Haute-Joaillerie" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Defensive Security Headers (OWASP Hardening) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />

    <!-- Google Fonts for Luxury Jewelry Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Content Anti-Theft / Image Copy Protection Script -->
    <script>
      // Protection contre le vol d'images et la copie non autorisée
      document.addEventListener('contextmenu', function(e) {
        if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') {
          e.preventDefault();
        }
      });
      document.addEventListener('dragstart', function(e) {
        if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-[#030303] text-[#FDFBF7] antialiased selection:bg-[#D4AF37]/30 selection:text-[#FDFBF7] overflow-x-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
